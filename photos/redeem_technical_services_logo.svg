<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="topArc" d="M 66.76,183.31 A 195,195 0 0,1 433.24,183.31" fill="none"/>
    <path id="bottomArc" d="M 66.76,316.69 A 195,195 0 0,0 433.24,316.69" fill="none"/>

    <linearGradient id="bedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9EFF7"/>
      <stop offset="100%" stop-color="#C3D4EA"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="250" cy="250" r="248" fill="#FFFFFF"/>

  <!-- outer rings -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#123159" stroke-width="14"/>
  <circle cx="250" cy="250" r="223" fill="none" stroke="#123159" stroke-width="2"/>
  <circle cx="250" cy="250" r="205" fill="none" stroke="#123159" stroke-width="2"/>

  <!-- curved company name -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="27" fill="#123159" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">REDEEM TECHNICAL SERVICES</textPath>
  </text>

  <!-- curved contact line -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16.5" fill="#123159" letter-spacing="0.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">CELL: +260 573 100 047 &#160;|&#160; +260 763 007 200</textPath>
  </text>

  <!-- stars flanking the curved text -->
  <g fill="#123159">
    <path transform="translate(50,250) scale(1.05)" d="M0,-14 L3.3,-4.3 13.3,-4.3 5.2,1.6 8.2,11.3 0,5.4 -8.2,11.3 -5.2,1.6 -13.3,-4.3 -3.3,-4.3 Z"/>
    <path transform="translate(450,250) scale(1.05)" d="M0,-14 L3.3,-4.3 13.3,-4.3 5.2,1.6 8.2,11.3 0,5.4 -8.2,11.3 -5.2,1.6 -13.3,-4.3 -3.3,-4.3 Z"/>
  </g>

  <!-- ground line under emblem -->
  <line x1="150" y1="277" x2="350" y2="277" stroke="#123159" stroke-width="2" opacity="0.25"/>

  <!-- ============ TRUCK EMBLEM ============ -->
  <g transform="translate(126,150)">

    <!-- hinge post at rear of bed, sitting on chassis -->
    <rect x="150" y="60" width="12" height="40" fill="#123159"/>
    <circle cx="156" cy="60" r="7" fill="#123159"/>

    <!-- raised dump bed, hinged at the rear (right) and lifted at the front (left) -->
    <g transform="rotate(-9 156 60)">
      <polygon points="10,22 150,22 162,60 25,66" fill="url(#bedGrad)" stroke="#123159" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="55" y1="22" x2="68" y2="64" stroke="#123159" stroke-width="2" opacity="0.4"/>
      <line x1="100" y1="22" x2="110" y2="62" stroke="#123159" stroke-width="2" opacity="0.4"/>
      <!-- hydraulic ram -->
      <rect x="66" y="35" width="10" height="60" rx="3" fill="#1E5AA8" stroke="#123159" stroke-width="2.5"/>
    </g>

    <!-- chassis -->
    <rect x="35" y="95" width="190" height="14" fill="#123159"/>

    <!-- cab -->
    <path d="M180,50 h34 a10,10 0 0 1 10,10 v39 h-58 v-27 a10,10 0 0 1 8,-9 z"
          fill="#1E5AA8" stroke="#123159" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="190" y="59" width="26" height="20" rx="3" fill="#DCE9FA" stroke="#123159" stroke-width="2"/>
    <!-- bumper / hood -->
    <path d="M225,78 h20 a8,8 0 0 1 8,8 v13 h-28 z" fill="#E9EFF7" stroke="#123159" stroke-width="3"/>

    <!-- wheels -->
    <g stroke="#123159" stroke-width="3.5">
      <circle cx="70" cy="112" r="21" fill="#22314A"/>
      <circle cx="70" cy="112" r="8" fill="#AFC4DE" stroke-width="2"/>
      <circle cx="130" cy="112" r="21" fill="#22314A"/>
      <circle cx="130" cy="112" r="8" fill="#AFC4DE" stroke-width="2"/>
      <circle cx="235" cy="112" r="19" fill="#22314A"/>
      <circle cx="235" cy="112" r="7" fill="#AFC4DE" stroke-width="2"/>
    </g>
  </g>

  <!-- ============ VB MONOGRAM ============ -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="250" y="345" font-size="78" fill="#1E5AA8" text-anchor="middle" letter-spacing="-6">VB</text>
  </g>

</svg>
